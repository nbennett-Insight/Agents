mcs.metadata:
  componentName: Conversation Start
  description: This system topic triggers when the agent receives an Activity indicating the beginning of a new conversation. If you do not want the agent to initiate the conversation, disable this topic.
kind: AdaptiveDialog
beginDialog:
  kind: OnConversationStart
  id: main
  actions:
    - kind: SendActivity
      id: sendMessage_M0LuhV
      activity:
        text:
          - Please enter an INC number to get started with a summary (example: INC1234567). If you already exported a PDF, you can also upload it now.
        speak:
          - Please enter an incident number to get started with a summary. If you already exported a PDF, you can also upload it now.