mcs.metadata:
  componentName: Greeting
  description: This topic is triggered when the user greets the agent.
kind: AdaptiveDialog
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: Greeting
    includeInOnSelectIntent: false
    triggerQueries:
      - Good afternoon
      - Good morning
      - Hello
      - Hey
      - Hi

  actions:
    - kind: SendActivity
      id: sendMessage_abmysR
      activity:
        text:
          - Please enter an INC number to get started with a summary (example: INC1234567). If you already exported a PDF, you can upload it now.
        speak:
          - Please enter an incident number to get started with a summary. If you already exported a PDF, you can upload it now.

    - kind: CancelAllDialogs
      id: cancelAllDialogs_01At22